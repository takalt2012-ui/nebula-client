[package]
name = "nebula-client"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A lightweight native launcher for Horizon with built-in performance controls"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "clipboard"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
