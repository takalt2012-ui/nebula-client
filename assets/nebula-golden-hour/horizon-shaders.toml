schema = 1
id = "nebula_golden_hour"
name = "Nebula Golden Hour"
version = "1.0.0"
api = "0.1"
description = "A restrained sunrise and sunset warmth, subtle bright-light glow, and gentle colour grade."
authors = ["Nebula Client"]
license = "MIT"
shared = ["common.wgsl"]

[sky]
file = "sky.wgsl"
name = "Warm horizon"

[[post]]
file = "post/glow.wgsl"
name = "Soft light"

[[post]]
file = "post/grade.wgsl"
name = "Colour grade"

[[options]]
id = "sun_glow"
name = "Sunset warmth"
description = "Warmth around the sun near the horizon."
type = "float"
default = 0.6
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "glow"
name = "Light glow"
description = "A restrained halo around bright things."
type = "float"
default = 0.25
min = 0.0
max = 0.7
step = 0.05

[[options]]
id = "warmth"
name = "Warmth"
description = "How golden the light turns near sunset."
type = "float"
default = 0.32
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "saturation"
name = "Saturation"
type = "float"
default = 1.05
min = 0.0
max = 1.5
step = 0.05

[[options]]
id = "vignette"
name = "Vignette"
type = "bool"
default = true

[budget]
gpu_ms = 1.0
